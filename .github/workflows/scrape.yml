name: Bilweb cars Scraper

on:
  schedule:
    # 04:05 UTC = 05:05 CET (winter).
    # During Swedish summer (CEST, UTC+2) this fires at 06:05 local.
    # Change to "5 3 * * *" if you want 05:05 CEST in summer instead.
    - cron: "18 10 * * *"
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write          # needed to push data back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repo ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ──
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Ensure data directory exists ──
      - name: Prepare data directory
        run: mkdir -p data

      # ── 5. Run the scraper (single run, not the scheduler) ──
      - name: Run scraper
        run: python scraper.py

      # ── 6. Commit updated database + CSV back to the repo ──
      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.db data/listings.csv
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "🚗 Scrape $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
